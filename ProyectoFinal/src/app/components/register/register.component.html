<div class="register-container">
  <h2>Registro de Usuario</h2>

  <form [formGroup]="registerForm" (ngSubmit)="register()">

    <input pInputText type="text" placeholder="Usuario" formControlName="username" />
    <br /><br />

    <input pInputText type="password" placeholder="Contraseña" formControlName="password" />
    <br /><br />

    <button pButton type="submit" label="Registrarse" class="btn"></button>

  </form>

  <p class="message">{{ message }}</p>
</div>
