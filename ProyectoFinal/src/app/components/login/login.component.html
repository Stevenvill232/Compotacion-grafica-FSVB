<div class="login-container" [formGroup]="user">
    <div class="login-card">

        <img src="https://opuspac.com/wp-content/uploads/2024/01/capa-farmacia-clinica.jpg" alt="Farmacia" class="logo-img">

        <h1 class="title">Farmacia S&S</h1>
        <p class="subtitle">Inicie sesión para continuar</p>

        <div class="input-group">
            <label for="username">Usuario</label>
            <input 
                type="text" 
                id="username"
                class="input"
                pInputText
                placeholder="Ingrese usuario"
                name="username"
                formControlName="username"
            >
            <div *ngIf="user.controls['username'].invalid && user.controls['username'].touched" class="error">
                El username es requerido
            </div>
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input 
                type="password"  
                id="password"
                class="input"
                pInputText
                name="password"
                formControlName="password"
                placeholder="Ingrese contraseña"
            >
            <div *ngIf="user.controls['password'].invalid && user.controls['password'].touched" class="error">
                Debe digitar la contraseña
            </div>
        </div>

        <button 
            pButton 
            type="submit" 
            label="Iniciar Sesión" 
            class="login-btn"
            (click)="redirigir()">
        </button>

        <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

        <p class="demo">¿No tiene una cuenta? <b>Crear una</b></p>

        <button pButton label="Crear cuenta" class="login-btn" (click)="redirigir1()"></button>
    </div>
</div>
